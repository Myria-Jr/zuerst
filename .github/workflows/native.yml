name: Zuerst native
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Test and build Android
        shell: bash
        run: |
          export JAVA_HOME="${JAVA_HOME_17_X64:?}"
          test -f "${ANDROID_HOME:?}/platforms/android-35/android.jar"
          test -x "$ANDROID_HOME/build-tools/34.0.0/aapt2"
          cd android
          bash gradlew --no-daemon :app:testReleaseUnitTest :app:assembleRelease
  ios:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Test Swift catalog
        shell: bash
        run: |
          swiftc ios/Zuerst/Catalog.swift ios/Tests/CatalogCheck.swift -o "$RUNNER_TEMP/catalog-check"
          "$RUNNER_TEMP/catalog-check" shared/catalog.json
      - name: Build iOS simulator app
        run: >-
          xcodebuild -project ios/Zuerst.xcodeproj -scheme Zuerst
          -destination 'generic/platform=iOS Simulator'
          -derivedDataPath "$RUNNER_TEMP/zuerst-build" CODE_SIGNING_ALLOWED=NO build
      - name: Launch iPhone and capture native screens
        timeout-minutes: 12
        shell: bash
        run: |
          DEVICE=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(x["udid"] for v in d["devices"].values() for x in v if x["name"].startswith("iPhone")))')
          xcrun simctl boot "$DEVICE"
          xcrun simctl bootstatus "$DEVICE" -b
          xcrun simctl install "$DEVICE" "$RUNNER_TEMP/zuerst-build/Build/Products/Debug-iphonesimulator/Zuerst.app"
          xcrun simctl launch "$DEVICE" labs.odkaz.zuerst
          sleep 3
          mkdir -p "$RUNNER_TEMP/zuerst-screens"
          xcrun simctl io "$DEVICE" screenshot "$RUNNER_TEMP/zuerst-screens/iphone-light.png"
          xcrun simctl ui "$DEVICE" appearance dark
          xcrun simctl ui "$DEVICE" content_size accessibility-large
          sleep 2
          xcrun simctl io "$DEVICE" screenshot "$RUNNER_TEMP/zuerst-screens/iphone-dark-large.png"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: zuerst-iphone-screens
          path: ${{ runner.temp }}/zuerst-screens/*.png
          if-no-files-found: warn
